name: CI

on:
  push:
    branches: [main]
  # Every pull request, not only those aimed at main: a branch stacked on
  # another branch is exactly where a regression is easiest to miss.
  pull_request:

# Least privilege by default; no job here needs to write anything.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      # Actions are pinned to commit SHAs: tags are mutable and can be
      # repointed at new code by whoever controls the action repository.
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run test suite
        run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src

  coverage:
    name: coverage floor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.13"

      # The measurement is standard library only, like everything else here,
      # so this job installs nothing.
      - name: Measure line coverage
        run: python tools/coverage.py --show-missing

  self-scan:
    name: scan own source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.13"

      # The test suite contains deliberate fake credentials, so it is excluded.
      - name: Scan this repository with repo-sentinel
        run: python -m repo_sentinel scan . --exclude tests --fail-on medium
        env:
          PYTHONPATH: src

  code-scanning:
    name: upload findings to the security tab
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only on push: a pull request from a fork runs with a read-only token and
    # the upload would fail on permissions rather than on anything real.
    if: github.event_name == 'push'
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.13"

      # The gate lives in the self-scan job above; this one exists to publish,
      # so a finding must not stop it before it has published anything.
      - name: Produce a SARIF report
        run: python -m repo_sentinel scan . --format sarif --output repo-sentinel.sarif
        continue-on-error: true
        env:
          PYTHONPATH: src

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@faaca9a8f6edddba5725ffe5adefdab6669a2eca # v3
        with:
          sarif_file: repo-sentinel.sarif
          category: repo-sentinel
