name: CI

on:
  push:
    branches: [main]
  # Every pull request, not only those aimed at main: a branch stacked on
  # another branch is exactly where a regression is easiest to miss.
  pull_request:
  # And on request, for the times GitHub does not notice a push -- which it
  # does not, occasionally, and a suite that cannot be started is a suite
  # nobody can trust the silence of.
  workflow_dispatch:

# Least privilege by default; no job here needs to write anything.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (${{ matrix.os }}, python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.11", "3.13"]
        # Every path this tool reports goes through a backslash-to-slash
        # normalisation, and until now nothing had ever run it on the platform
        # that produces backslashes.
        include:
          - os: windows-latest
            python-version: "3.13"
    steps:
      # Actions are pinned to commit SHAs: tags are mutable and can be
      # repointed at new code by whoever controls the action repository.
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run test suite
        run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src

  coverage:
    name: coverage floor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # The measurement is standard library only, like everything else here,
      # so this job installs nothing.
      - name: Measure line coverage
        run: python tools/coverage.py --show-missing

  types:
    name: type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # mypy is the one tool here that is not standard library. It runs in CI
      # rather than being required of a contributor, so the zero-install
      # promise still holds for anyone working offline.
      - name: Install mypy
        run: python -m pip install --quiet "mypy==1.14.1"

      - name: Check types
        run: mypy --python-version 3.9 --ignore-missing-imports src/bluerayscan

  self-scan:
    name: scan own source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # The test suite contains deliberate fake credentials, so it is excluded.
      - name: Scan this repository with bluerayscan
        run: python -m bluerayscan scan . --exclude tests --fail-on medium
        env:
          PYTHONPATH: src

  code-scanning:
    name: upload findings to the security tab
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only on push: a pull request from a fork runs with a read-only token and
    # the upload would fail on permissions rather than on anything real.
    if: github.event_name == 'push'
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # The gate lives in the self-scan job above; this one exists to publish,
      # so a finding must not stop it before it has published anything.
      - name: Produce a SARIF report
        run: >-
          python -m bluerayscan scan . --format sarif
          --output bluerayscan.sarif --fail-on none
        env:
          PYTHONPATH: src

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@faaca9a8f6edddba5725ffe5adefdab6669a2eca # v3
        with:
          sarif_file: bluerayscan.sarif
          category: bluerayscan
