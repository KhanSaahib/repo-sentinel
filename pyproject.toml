[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-sentinel"
version = "0.2.0"
description = "Audit a repository for leaked secrets, risky GitHub Actions workflows, and insecure configuration."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "KhanSaahib" }]
keywords = ["security", "secrets", "sast", "github-actions", "static-analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

# No runtime dependencies, by design. Every dependency is a supply-chain risk,
# and a security scanner has no business adding one.
dependencies = []

[project.urls]
Homepage = "https://github.com/KhanSaahib/repo-sentinel"
Issues = "https://github.com/KhanSaahib/repo-sentinel/issues"

[project.scripts]
repo-sentinel = "repo_sentinel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
