[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bluerayscan"
version = "0.3.1"
description = "Audit a repository for leaked secrets, risky CI workflows, and insecure container and infrastructure configuration."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "KhanSaahib" }]
keywords = [
    "security",
    "secrets",
    "sast",
    "github-actions",
    "terraform",
    "kubernetes",
    "docker",
    "static-analysis",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

# No runtime dependencies, by design. Every dependency is a supply-chain risk,
# and a security scanner has no business adding one.
dependencies = []

[project.urls]
Homepage = "https://github.com/KhanSaahib/bluerayscan"
Issues = "https://github.com/KhanSaahib/bluerayscan/issues"

[project.scripts]
bluerayscan = "bluerayscan.cli:main"
repo-sentinel = "bluerayscan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
